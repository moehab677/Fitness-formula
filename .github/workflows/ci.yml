name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint && npm run check:props
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium && npm run build && npx playwright test tests/a11y tests/e2e
      - run: npx playwright test tests/visual
      - run: npm run lhci
      - uses: snyk/actions/node@master
        env: { SNYK_TOKEN: '${{ secrets.SNYK_TOKEN }}' }
        with: { command: code test }
      - uses: snyk/actions/node@master
        env: { SNYK_TOKEN: '${{ secrets.SNYK_TOKEN }}' }
        with: { command: test --severity-threshold=high }
      - uses: actions/upload-artifact@v4
        with: { name: site-dist, path: dist/ }
